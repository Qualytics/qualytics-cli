    staticParams: [ssl=true]  # LLM-suggested: Appending ssl=true as a static URL parameter ensures encrypted connections are enforced for every Redshift connection.
    conditionalParams: [{key: schema, param: 'currentSchema={schema}'}]  # LLM-suggested: Redshift supports the currentSchema JDBC parameter to set the default search path, matching the PostgreSQL convention.
