sql:
  # ── SQL functions ────────────────────────────────────────────────
  # Closed vocab: APPROX_COUNT_DISTINCT, APPROX_DISTINCT, RANDOM, RAND, NEWID, DBMS_RANDOM_VALUE
  functions: []
  # ── SQL clauses ──────────────────────────────────────────────────
  # Closed vocab: TABLESAMPLE_SYSTEM, TABLESAMPLE_SYSTEM_PERCENT, TABLESAMPLE_BERNOULLI, TABLESAMPLE_PERCENT, TABLESAMPLE_ROWS, SAMPLE_PERCENT, SAMPLE_ROWS, LIMIT, OFFSET_FETCH, ROWNUM
  clauses: []
  # ── SQL queries ──────────────────────────────────────────────────
  # QuerySlot keys: nullCheck, schemaOnly, rowCount, volume, freshness, partitionColumn, lineage
  queries:
    schemaOnly: SQLSERVER_TOP0  # auto-detected — how to wrap a query to return 0 rows for schema inspection. Valid: CTE (default), PG_CTE (PostgreSQL), SQLSERVER_TOP0 (SQL Server), WHERE_FALSE_QUERYA (generic WHERE 1=0), ORACLE_WHERE_FALSE (Oracle), HIVE_LIMIT0 (Hive/Spark)
    rowCount: COUNT_STAR  # LLM-suggested: Redshift does not reliably expose live row counts in information_schema.tables, so COUNT_STAR is the safest accurate strategy.
    # ── Freshness query slot ──────────────────────────────────────
    freshness:
      style: DATEADD_DATEDIFF  # auto-detected — date arithmetic strategy. Valid: STANDARD (default, ANSI fallback), DATEADD_DATEDIFF (SQL Server), NUMTODSINTERVAL (Oracle), TIMESTAMP_ADD (BigQuery), TIMESTAMPDIFF_DB2 (Db2)
      # Placeholders: {col} = column name, MIN_{col} = min value, MAX_{col} = max value, {interval} = midpoint expression
      intervalCalcDatetimeTimestampTemplate: DATEADD(second, DATEDIFF(second, MIN_{col}, MAX_{col}) / 3, MIN_{col})  # auto-detected
      intervalCalcDatetimeDateTemplate: DATEADD(day, DATEDIFF(day, MIN_{col}, MAX_{col}) / 3, MIN_{col})  # auto-detected
      upperBoundDatetimeTimestampTemplate: DATEADD(second, DATEDIFF(second, MIN_{col}, {interval}), {interval})  # auto-detected
      upperBoundDatetimeDateTemplate: DATEADD(day, DATEDIFF(day, MIN_{col}, {interval}), {interval})  # auto-detected

