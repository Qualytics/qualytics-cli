  systemSchemaExclusions: [information_schema, pg_catalog, pg_internal, catalog_history]  # LLM-suggested: These are Redshift system/internal schemas that should be excluded from user-facing catalog scans.
  systemSchemaExclusionPrefixes: [pg_temp_, pg_toast_]  # LLM-suggested: Redshift inherits PostgreSQL temporary and toast schema naming conventions which should be excluded from scans.
  systemCatalogExclusions: []  # LLM-suggested: Redshift Serverless does not expose multiple catalogs in the same way as multi-catalog databases; no catalog exclusions are needed.

  # ── Connectivity ─────────────────────────────────────────────────────
  networkCapable: true  # default true — set false for embedded/file-based drivers (e.g. SQLite, H2 embedded) that need no network host
  readOnly: false  # default false — set true if this driver cannot write (e.g. read-only replicas, analytical engines)
  supportsLongLimit: false  # default false — set true if LIMIT/TOP accepts values > Integer.MAX_VALUE (2^31-1); needed for databases with very large tables
  defaultInsertBatchSize: null         # optional: override the default JDBC batch size for INSERT statements (e.g. 1000); null uses the platform default
