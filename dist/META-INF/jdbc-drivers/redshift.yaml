  defaultPort: 5439  # auto-detected from JDBC URL — default port shown in the connection form
  transactionIsolation: SERIALIZABLE  # auto-detected — valid: NONE, READ_UNCOMMITTED (default), READ_COMMITTED, SERIALIZABLE
  tableNameCasing: LOWER  # auto-detected — valid: UPPER (DB2/Oracle), LOWER (PostgreSQL), AS_IS (default, most others)
