  subqueryAlias: false  # auto-detected — false: subqueries do NOT need an AS alias (rare; historically Oracle)
  timestampLiteralStyle: TIMESTAMP_PREFIX  # auto-detected — valid: PLAIN (default), TIMESTAMP_PREFIX (standard SQL), CAST_AS_TIMESTAMP (Hive), CAST_DATE_FORMAT (Databricks), TO_TIMESTAMP (Oracle), CAST_DATETIME2 (SQL Server)

